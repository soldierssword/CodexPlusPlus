name: Build installer

# 手动触发（Actions 页面点 Run workflow），或推送 v* tag 自动触发。
# 产物：Windows NSIS 安装包 + 免安装 zip、macOS DMG + zip，
# 上传为 Actions Artifacts；勾选 publish_release（或 tag 触发）时同时创建 Release。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不带 v 前缀）。留空则读取 Cargo.toml 的 workspace version"
        required: false
        type: string
      targets:
        description: "构建平台"
        required: true
        default: windows
        type: choice
        options:
          - windows
          - macos
          - all
      publish_release:
        description: "构建完成后创建 Release 并上传安装包（便于分发下载）"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  setup:
    name: Resolve version and targets
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_windows: ${{ steps.plan.outputs.build_windows }}
      build_macos: ${{ steps.plan.outputs.build_macos }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          if [ -z "$version" ] && [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            version="${GITHUB_REF_NAME}"
          fi
          version="${version#v}"
          version="${version#V}"
          if [ -z "$version" ]; then
            version="$(awk '
              /^\[/ { in_pkg = ($0 == "[workspace.package]"); next }
              in_pkg && /^version[[:space:]]*=/ {
                gsub(/^version[[:space:]]*=[[:space:]]*"/, "");
                gsub(/"[[:space:]]*$/, "");
                print;
                exit
              }
            ' Cargo.toml)"
          fi
          if [ -z "$version" ]; then
            version="0.0.0-${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "resolved version: $version"

      - name: Resolve targets
        id: plan
        shell: bash
        env:
          INPUT_TARGETS: ${{ inputs.targets }}
          INPUT_PUBLISH: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            targets="all"
            publish="true"
          else
            targets="${INPUT_TARGETS:-windows}"
            publish="${INPUT_PUBLISH:-false}"
          fi

          build_windows=false
          build_macos=false
          case "$targets" in
            windows) build_windows=true ;;
            macos) build_macos=true ;;
            all) build_windows=true; build_macos=true ;;
            *) echo "unknown targets: $targets" >&2; exit 1 ;;
          esac

          {
            echo "build_windows=$build_windows"
            echo "build_macos=$build_macos"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "targets=$targets publish=$publish"

  windows-installer:
    name: Windows installer
    needs: setup
    if: needs.setup.outputs.build_windows == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install NSIS
        run: choco install nsis -y

      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: npm install --package-lock=false

      - name: Build frontend
        working-directory: apps/codex-plus-manager
        run: npm run vite:build

      # 前端产物需先于 cargo build 就绪：Tauri 编译期会把前端嵌入 exe。
      - name: Build binaries
        run: cargo build --release

      - name: Stage Windows app files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows/app | Out-Null
          Copy-Item target/release/codex-plus-plus.exe dist/windows/app/
          Copy-Item target/release/codex-plus-plus-manager.exe dist/windows/app/

      - name: Build Windows installer
        shell: pwsh
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { $makensis = "makensis" }
          Push-Location scripts/installer/windows
          & $makensis "/INPUTCHARSET" "UTF8" "/DVERSION=$env:VERSION" CodexPlusPlus.nsi
          Pop-Location
          $setup = "dist/windows/CodexPlusPlus-$env:VERSION-windows-x64-setup.exe"
          if (-not (Test-Path $setup)) { throw "installer not produced: $setup" }
          Get-Item $setup | Select-Object Name, Length

      - name: Build Windows portable zip
        shell: pwsh
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          Compress-Archive -Path dist/windows/app/* `
            -DestinationPath "dist/windows/CodexPlusPlus-$env:VERSION-windows-x64.zip" -Force

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: codex-plus-plus-windows-installer
          path: dist/windows/*-setup.exe
          if-no-files-found: error

      - name: Upload Windows portable zip
        uses: actions/upload-artifact@v4
        with:
          name: codex-plus-plus-windows-portable
          path: dist/windows/*-windows-x64.zip
          if-no-files-found: error

  macos-dmg:
    name: macOS DMG (${{ matrix.arch }})
    needs: setup
    if: needs.setup.outputs.build_macos == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - arch: arm64
            runner: macos-14
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: npm install --package-lock=false

      - name: Build frontend
        working-directory: apps/codex-plus-manager
        run: npm run vite:build

      - name: Build binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build macOS DMG
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          BINARY_DIR="$PWD/target/${{ matrix.target }}/release" \
            bash scripts/installer/macos/package-dmg.sh "$VERSION" "${{ matrix.arch }}"

      - name: Build macOS zip
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          mkdir -p "dist/macos/app-${{ matrix.arch }}"
          cp "target/${{ matrix.target }}/release/codex-plus-plus" "dist/macos/app-${{ matrix.arch }}/"
          cp "target/${{ matrix.target }}/release/codex-plus-plus-manager" "dist/macos/app-${{ matrix.arch }}/"
          (cd dist/macos && zip -r "CodexPlusPlus-${VERSION}-macos-${{ matrix.arch }}.zip" "app-${{ matrix.arch }}")

      - name: Verify macOS bundle structure
        run: |
          set -euo pipefail
          test -L "dist/macos/stage/Applications"
          test "$(readlink "dist/macos/stage/Applications")" = "/Applications"
          for app in "dist/macos/stage/Codex++.app" "dist/macos/stage/Codex++ 管理工具.app"; do
            test -f "$app/Contents/Info.plist"
            test -f "$app/Contents/PkgInfo"
            test -x "$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
            plutil -lint "$app/Contents/Info.plist" >/dev/null
            codesign -dv "$app" >/dev/null 2>&1
            echo "verified: $app"
          done

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: codex-plus-plus-macos-${{ matrix.arch }}-dmg
          path: dist/macos/*.dmg
          if-no-files-found: error

      - name: Upload macOS zip
        uses: actions/upload-artifact@v4
        with:
          name: codex-plus-plus-macos-${{ matrix.arch }}-zip
          path: dist/macos/*-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  publish-release:
    name: Publish release
    needs:
      - setup
      - windows-installer
      - macos-dmg
    if: |
      always()
      && needs.setup.outputs.publish == 'true'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.setup.outputs.version }}
          name: Codex++ v${{ needs.setup.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
